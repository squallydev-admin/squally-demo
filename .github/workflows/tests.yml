name: Tests

on:
  # ONCE A DAY SINCE 16.10.2026 (owner), when the account's GitHub Actions
  # budget ran out: it ran four times a day (three shards each) plus on every
  # push and pull request. No push or pull_request trigger any more; by hand
  # it still runs at any time.
  schedule:
    # Minute :17, not :00 - GitHub delays or skips runs queued on the hour.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      # For trying "Cancel workflow" (27.10.2026): the suite takes about 30
      # seconds, too fast to cancel by hand. "slow" adds one test that waits
      # about 3 minutes (tests/slow-cancel.spec.ts). The schedule has no
      # inputs, so it never runs slow.
      slow:
        description: Add one test that waits ~3 min, to try Cancel workflow
        type: boolean
        default: false

jobs:
  test:
    name: shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # The suite always has one failing test (the real bug), so a failing
      # shard must not cancel the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SQUALLY_REPORT: "1"
      SQUALLY_INGEST_URL: https://app.squally.dev
      SQUALLY_INGEST_KEY: ${{ secrets.SQUALLY_INGEST_KEY }}
      # One Squally run per workflow run, made of the three shards. (The
      # reporter's own default on GitHub Actions is the same value.)
      SQUALLY_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # "1" only for a manual run with slow ticked; empty on schedule.
      SLOW_CANCEL: ${{ inputs.slow && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # BROWSERS FROM A CACHE (27.10.2026): Tests #88's shard 2 hung for 11
      # minutes in this step while shards 1 and 3 took 25 seconds - apt
      # fetching the system libraries from a mirror at ~50 kB/s. The cache
      # cannot hold those (see below); the 5-minute timeout bounds them.
      # The cache holds ~/.cache/ms-playwright per Playwright version (the one
      # npm ci installed), so a version bump downloads once and every other
      # run skips the download. Both browsers in every job: chromium and
      # firefox are Playwright projects, and --shard splits the tests of both
      # across the shards. Chromium only as the headless shell - the suite
      # never runs headed.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell-firefox

      # A hung download or apt mirror fails the job after 5 minutes instead of
      # holding it until the job timeout.
      - name: Install Playwright browsers
        id: browser-install
        if: steps.browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps --only-shell chromium firefox

      # Saved right after the install, not at the end of the job: actions/cache
      # saves only from a job that succeeds, and shard 1 always fails (the real
      # bug) - Tests #89 saved nothing. always(): a cancel that lands right
      # after the install does not skip the save. When several shards save the same key, one
      # wins and the others only warn.
      - name: Save Playwright browsers
        if: always() && steps.browser-install.outcome == 'success' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      # The system libraries are not in the cache (apt, outside the home
      # directory); on a cache hit only they are installed.
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium firefox

      - name: Run Playwright tests
        # exec: a cancelled workflow sends SIGINT only to the step's top-level
        # process, so Playwright must be that process to report "cancelled".
        run: exec ./node_modules/.bin/playwright test --shard=${{ matrix.shard }}/3

      # "Cancel workflow" (27.10.2026, squally-reporter 0.14.0): GitHub's
      # SIGINT does not always reach Playwright, and a shard still queued never
      # starts at all - this marks the Squally run cancelled either way, with
      # the job's own key and SQUALLY_CI_RUN_ID from the env above. The run
      # page then says "Cancelled via the CLI".
      - name: Mark Squally run cancelled
        if: ${{ cancelled() }}
        run: npx squally-reporter cancel
